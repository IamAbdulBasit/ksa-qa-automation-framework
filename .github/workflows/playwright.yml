name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4                    # get your code

      - uses: actions/setup-node@v4                  # install Node
        with:
          node-version: 20

      - run: npm ci                                  # clean, locked install
      - run: npx playwright install --with-deps chromium   # browser + OS deps

      - run: npx playwright test                     # run setup + tests, headless
        env:                                         # inject secrets as env vars
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CI: true                                   # flips your config's CI-only settings

      - uses: actions/upload-artifact@v4             # save the report EVEN on failure
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7